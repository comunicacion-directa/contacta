<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicita más información</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #090a0f;
            --accent-glow: rgba(37, 211, 102, 0.15);
            --card-bg: rgba(18, 20, 29, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --brand-whatsapp: #25D366;
            --brand-whatsapp-hover: #20bd5a;
            --btn-text: #051d0d;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(124, 58, 237, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, var(--accent-glow) 0%, transparent 50%);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* ESTRUCTURA PRINCIPAL */

        .pagina {
            width: 100%;
            max-width: 440px;
            text-align: center;
            animation: entrada 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .marca {
            width: 72px;
            height: 72px;
            margin: 0 auto 28px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--brand-whatsapp);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .marca svg {
            width: 36px;
            height: 36px;
            fill: currentColor;
            filter: drop-shadow(0 2px 8px rgba(37, 211, 102, 0.4));
        }

        .tarjeta {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 44px 32px 36px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.56), 0 18px 36px -18px rgba(0, 0, 0, 0.7);
        }

        h1 {
            margin-bottom: 16px;
            font-size: clamp(24px, 6vw, 30px);
            line-height: 1.25;
            letter-spacing: -0.02em;
            font-weight: 800;
            background: linear-gradient(180deg, #FFFFFF 0%, #CBD5E1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .descripcion {
            margin: 0 auto 32px;
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.6;
        }

        .descripcion .titulo-destacado {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #F1F5F9;
            font-size: 16px;
            letter-spacing: -0.01em;
        }

        .descripcion .subtexto {
            display: block;
            color: #94A3B8;
        }

        /* BOTÓN INTERACTIVO */

        .boton {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px 24px;
            border-radius: 18px;
            background: linear-gradient(135deg, #25D366 0%, #1DA851 100%);
            color: var(--btn-text);
            border: none;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 28px -6px rgba(37, 211, 102, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .boton:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 36px -6px rgba(37, 211, 102, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            background: linear-gradient(135deg, #28e16d 0%, #20bd5a 100%);
        }

        .boton:active {
            transform: translateY(1px) scale(0.99);
            box-shadow: 0 6px 16px -4px rgba(37, 211, 102, 0.4);
        }

        .icono {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.15);
            color: var(--btn-text);
            transition: transform 0.25s ease;
        }

        .boton:hover .icono {
            transform: translateX(3px);
        }

        .confianza {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        .punto {
            position: relative;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--brand-whatsapp);
            box-shadow: 0 0 10px var(--brand-whatsapp);
        }

        .punto::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            border: 1px solid var(--brand-whatsapp);
            animation: pulso 2s infinite;
        }

        /* ESTADO DE CARGA */

        .procesando {
            opacity: 0.7;
            pointer-events: none;
            cursor: wait;
            filter: grayscale(0.2);
        }

        /* ANIMACIONES */

        @keyframes entrada {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes pulso {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(2.2);
                opacity: 0;
            }
        }

        /* ADAPTACIÓN MÓVIL */

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }
            .tarjeta {
                padding: 36px 20px 28px;
                border-radius: 24px;
            }
            .marca {
                width: 64px;
                height: 64px;
                border-radius: 20px;
                margin-bottom: 20px;
            }
            .descripcion {
                font-size: 14px;
            }
            .boton {
                padding: 16px;
                border-radius: 14px;
            }
        }
    </style>
</head>

<body>

    <main class="pagina">

        <div class="marca" aria-hidden="true">
            <svg viewBox="0 0 24 24">
                <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L3.5 21l3.52-1.42c1.46.95 3.19 1.42 4.98 1.42 4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 16c-1.54 0-3.04-.42-4.34-1.22l-.31-.19-2.09.84.85-2.03-.21-.33C5.07 14.77 4.5 13.43 4.5 12c0-4.14 3.36-7.5 7.5-7.5s7.5 3.36 7.5 7.5-3.36 7.5-7.5 7.5z"/>
            </svg>
        </div>

        <section class="tarjeta">
            <h1>Solicita más información ahora mismo</h1>

            <p class="descripcion">
                <span class="titulo-destacado">
                    ¿QUIERES SABER CON QUIÉN PLATICA TU PAREJA?
                </span>
                <span class="subtexto">
                    Da clic al botón y comunícate por WhatsApp
                </span>
            </p>

            <a id="boton-contacto" class="boton" href="https://wa.me/525635121377?text=Solicito%20más%20información" target="_blank" rel="noopener noreferrer">
                <span>Quiero más información</span>
                <span class="icono" aria-hidden="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </span>
            </a>

            <div class="confianza">
                <span class="punto" aria-hidden="true"></span>
                Atención en línea disponible
            </div>
        </section>

    </main>

    <!-- REGISTRO DE EVENTO Y REDIRECCIÓN -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const boton = document.getElementById('boton-contacto');

            if (!boton) return;

            boton.addEventListener('click', function(event) {
                event.preventDefault();

                if (boton.classList.contains('procesando')) return;
                boton.classList.add('procesando');

                const destino = boton.href;
                const target = boton.target || '_self';
                const eventID = 'contact_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);

                // Tracking de Meta Pixel con fallback seguro
                if (typeof fbq === 'function') {
                    fbq('track', 'Contact', {}, { eventID: eventID });
                }

                // Redirección optimizada a 300ms manteniendo la navegación original
                setTimeout(function() {
                    if (target === '_blank') {
                        window.open(destino, '_blank', 'noopener,noreferrer');
                    } else {
                        window.location.href = destino;
                    }
                    
                    // Restablecer estado por si el usuario regresa a la pestaña original
                    setTimeout(function() {
                        boton.classList.remove('procesando');
                    }, 1000);
                }, 300);
            });
        });
    </script>

</body>
</html>
